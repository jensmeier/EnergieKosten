<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root{
  --ek-text:var(--content-color,#fff);
  --ek-muted:color-mix(in srgb,var(--content-color,#fff) 62%,transparent);
  --ek-soft:color-mix(in srgb,var(--content-color,#fff) 8%,transparent);
  --ek-soft-strong:color-mix(in srgb,var(--content-color,#fff) 12%,transparent);
  --ek-border:color-mix(in srgb,var(--content-color,#fff) 22%,transparent);
  --ek-accent:var(--accent-color,#3478f6);
  --ek-grid:#d9534f;
  --ek-feed:#2f9e62;
  --ek-heat:#e28b2d;
}
button{font:inherit}
.ek-wrap{
  position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;
  color:var(--ek-text);background:transparent;padding:.42em .48em .34em;font-size:12px;
}
.ek-inner{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.34em;min-width:0;min-height:0}
.ek-head{display:flex;align-items:center;justify-content:space-between;gap:.45em;min-width:0}
.ek-title{font-size:1.28em;line-height:1.05;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-period{flex:0 0 auto;font-size:.76em;line-height:1;padding:.34em .64em;border:1px solid var(--ek-border);border-radius:999px;color:var(--ek-muted);background:var(--ek-soft);white-space:nowrap}
.ek-list{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:.28em;min-height:0}
.ek-row{display:grid;grid-template-columns:.80em minmax(0,1fr) auto;align-items:center;column-gap:.55em;min-width:0;min-height:0;padding:.28em .46em;border:1px solid var(--ek-border);border-radius:.72em;background:var(--ek-soft)}
.ek-dot{width:.60em;height:.60em;border-radius:50%;justify-self:center}
.ek-dot.grid{background:var(--ek-grid)}.ek-dot.feed{background:var(--ek-feed)}.ek-dot.heat{background:var(--ek-heat)}
.ek-label{font-size:.90em;color:var(--ek-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-values{text-align:right;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.ek-main{font-size:1.34em;line-height:1;font-weight:900;letter-spacing:.01em}
.ek-sub{margin-top:.20em;font-size:.72em;line-height:1;color:var(--ek-muted);font-weight:600}
.ek-foot{font-size:.66em;line-height:1;color:var(--ek-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-open{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer;z-index:10}
.ek-wrap.large{font-size:14px;padding:.48em .56em .40em}.ek-wrap.large .ek-main{font-size:1.42em}.ek-wrap.large .ek-title{font-size:1.34em}
.ek-wrap.compact{padding:.30em .34em .24em}.ek-wrap.compact .ek-inner{gap:.22em}.ek-wrap.compact .ek-row{padding:.20em .34em;border-radius:.58em}.ek-wrap.compact .ek-main{font-size:1.25em}.ek-wrap.compact .ek-sub{font-size:.68em}
.ek-wrap.mini{padding:.22em .26em .18em}.ek-wrap.mini .ek-foot{display:none}.ek-wrap.mini .ek-inner{gap:.14em}.ek-wrap.mini .ek-row{padding:.12em .24em;border-radius:.48em}.ek-wrap.mini .ek-title{font-size:1.14em}.ek-wrap.mini .ek-period{font-size:.69em;padding:.26em .48em}.ek-wrap.mini .ek-label{font-size:.82em}.ek-wrap.mini .ek-main{font-size:1.16em}.ek-wrap.mini .ek-sub{font-size:.63em;margin-top:.12em}
.ek-wrap.nano{padding:.16em .18em}.ek-wrap.nano .ek-foot{display:none}.ek-wrap.nano .ek-inner{gap:.10em}.ek-wrap.nano .ek-head{gap:.20em}.ek-wrap.nano .ek-title{font-size:1.05em}.ek-wrap.nano .ek-period{font-size:.62em;padding:.20em .38em}.ek-wrap.nano .ek-row{grid-template-columns:.66em minmax(0,1fr) auto;column-gap:.30em;padding:.08em .16em;border-radius:.40em}.ek-wrap.nano .ek-label{font-size:.72em}.ek-wrap.nano .ek-main{font-size:1.02em}.ek-wrap.nano .ek-sub{font-size:.56em}
.ek-wrap.micro .ek-label,.ek-wrap.micro .ek-foot{display:none}.ek-wrap.micro .ek-row{grid-template-columns:.60em minmax(0,1fr);padding:.06em .12em}.ek-wrap.micro .ek-values{grid-column:2;width:100%}.ek-wrap.micro .ek-title{font-size:.96em}.ek-wrap.micro .ek-period{font-size:.58em}.ek-wrap.micro .ek-main{font-size:.95em}.ek-wrap.micro .ek-sub{font-size:.53em}
</style>

<div class="ek-wrap" id="ekWrap">
  <div class="ek-inner">
    <div class="ek-head">
      <div class="ek-title">Energie &amp; Kosten</div>
      <div class="ek-period" id="compactPeriod">Heute</div>
    </div>
    <div class="ek-list">
      <div class="ek-row">
        <span class="ek-dot grid"></span><span class="ek-label">Netzbezug</span>
        <span class="ek-values"><div class="ek-main" id="cGridEuro">—</div><div class="ek-sub" id="cGrid">—</div></span>
      </div>
      <div class="ek-row">
        <span class="ek-dot feed"></span><span class="ek-label">Einspeisung</span>
        <span class="ek-values"><div class="ek-main" id="cFeedEuro">—</div><div class="ek-sub" id="cFeed">—</div></span>
      </div>
      <div class="ek-row">
        <span class="ek-dot heat"></span><span class="ek-label">Heizstab</span>
        <span class="ek-values"><div class="ek-main" id="cHeat">—</div><div class="ek-sub" id="cOil">—</div></span>
      </div>
    </div>
    <div class="ek-foot">Antippen für Diagramm &amp; Prognose</div>
  </div>
  <button class="ek-open" id="openDetails" aria-label="Energie-Diagramm und Prognose öffnen"></button>
</div>

<script>
const EK_DETAIL_ID=__DETAIL_ID__;
let ekData=__INITIAL_DATA__,compactIndex=0,compactTimer=null;
const validNumber=n=>n!==null&&n!==''&&Number.isFinite(Number(n));
const euro=n=>validNumber(n)?Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':'—';
const kwh=n=>validNumber(n)?Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' kWh':'—';
const liter=n=>validNumber(n)?Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' L Öl gespart':'—';
const periods=()=>[{key:'today',label:'Heute'},{key:'month',label:'Monat'},{key:'year',label:'Jahr'}];
function renderCompact(){
  if(!ekData?.ok||!ekData.summary)return;
  const p=periods()[compactIndex%3],s=ekData.summary[p.key];if(!s)return;
  compactPeriod.textContent=p.label;
  cGridEuro.textContent=euro(s.grid.euro);cGrid.textContent=kwh(s.grid.kwh);
  cFeedEuro.textContent=euro(s.feed.euro);cFeed.textContent=kwh(s.feed.kwh);
  cHeat.textContent=kwh(s.heater.kwh);cOil.textContent=liter(s.heater.oilLiter);
}
function restartTimer(){
  if(compactTimer)clearInterval(compactTimer);
  const sec=Math.max(3,Math.min(60,Number(ekData?.cycleSeconds||8)));
  compactTimer=setInterval(()=>{compactIndex=(compactIndex+1)%3;renderCompact()},sec*1000);
}
function adapt(){
  const r=ekWrap.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),area=w*h;
  const base=Math.max(8.4,Math.min(14.5,Math.min(w/21.5,h/18.0)));
  ekWrap.style.fontSize=base.toFixed(2)+'px';
  const micro=(w<150||h<112||area<16500);
  const nano=!micro&&(w<190||h<145||area<25500);
  const mini=!micro&&!nano&&(w<235||h<185||area<39000);
  const large=!micro&&!nano&&!mini&&(w>=335&&h>=260&&area>=90000);
  const compact=!micro&&!nano&&!mini&&!large&&(w<305||h<235||area<70000);
  ekWrap.classList.toggle('micro',micro);ekWrap.classList.toggle('nano',nano);ekWrap.classList.toggle('mini',mini);ekWrap.classList.toggle('compact',compact);ekWrap.classList.toggle('large',large);
}
function renderAll(){renderCompact();restartTimer();adapt()}
function handleMessage(data){try{ekData=typeof data==='string'?JSON.parse(data):data}catch(e){ekData={ok:false}}renderAll()}
window.handleMessage=handleMessage;
openDetails.addEventListener('click',()=>{if(typeof openObject==='function'&&EK_DETAIL_ID>0)openObject(EK_DETAIL_ID)});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(adapt).observe(ekWrap);else window.addEventListener('resize',adapt);
window.addEventListener('orientationchange',()=>setTimeout(adapt,80));
renderAll();setTimeout(adapt,0);setTimeout(adapt,120);
</script>
