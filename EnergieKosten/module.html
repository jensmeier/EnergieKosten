<style>
:root {
    color-scheme: light dark;
    --ek-bg: #f5f7fa;
    --ek-text: #18202a;
    --ek-muted: #6b7480;
    --ek-border: rgba(24,32,42,.12);
    --ek-grid: #d9534f;
    --ek-feed: #2f9e62;
    --ek-heat: #e28b2d;
}
@media (prefers-color-scheme: dark) {
    :root {
        --ek-bg: #171a1f;
        --ek-text: #f3f5f7;
        --ek-muted: #a6adb7;
        --ek-border: rgba(255,255,255,.11);
    }
}
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ek-text); background:transparent; }
.ek-wrap { position:relative; width:100%; height:100%; min-width:0; min-height:0; background:var(--ek-bg); overflow:hidden; }
.ek-compact {
    position:relative; width:100%; height:100%; min-width:0; min-height:0;
    padding:40px 14px 10px; display:flex; flex-direction:column;
}
.ek-period {
    position:absolute; top:34px; right:12px;
    font-size:11px; line-height:1; color:var(--ek-muted);
    padding:4px 8px; border:1px solid var(--ek-border); border-radius:999px;
    white-space:nowrap; pointer-events:none;
}
.ek-mini-grid {
    display:grid; grid-template-columns:1fr; gap:7px; flex:1; align-content:center;
    min-height:0; padding-top:8px;
}
.ek-mini-row {
    display:grid; grid-template-columns:18px minmax(0,1fr) minmax(92px,auto);
    align-items:center; gap:6px; min-width:0;
}
.ek-dot { width:10px; height:10px; border-radius:50%; justify-self:center; }
.ek-dot.grid { background:var(--ek-grid); }
.ek-dot.feed { background:var(--ek-feed); }
.ek-dot.heat { background:var(--ek-heat); }
.ek-mini-label {
    font-size:13px; color:var(--ek-muted); min-width:0; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
}
.ek-value-box { min-width:0; text-align:right; }
.ek-mini-main {
    font-size:16px; line-height:1.12; font-weight:800; white-space:nowrap;
    font-variant-numeric:tabular-nums;
}
.ek-mini-sub {
    margin-top:2px; font-size:10px; line-height:1.1; color:var(--ek-muted); white-space:nowrap;
    font-variant-numeric:tabular-nums;
}
.ek-foot { min-height:12px; font-size:9px; color:var(--ek-muted); text-align:center; white-space:nowrap; }
.ek-open { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; z-index:5; }

/* Auto-Größe: Klassen werden mit ResizeObserver anhand der echten Kachelgröße gesetzt. */
.ek-wrap.ek-sm .ek-compact { padding:37px 10px 7px; }
.ek-wrap.ek-sm .ek-period { top:31px; right:9px; font-size:10px; padding:3px 7px; }
.ek-wrap.ek-sm .ek-mini-grid { gap:5px; padding-top:7px; }
.ek-wrap.ek-sm .ek-mini-row { grid-template-columns:16px minmax(0,1fr) minmax(82px,auto); gap:4px; }
.ek-wrap.ek-sm .ek-dot { width:9px; height:9px; }
.ek-wrap.ek-sm .ek-mini-label { font-size:11px; }
.ek-wrap.ek-sm .ek-mini-main { font-size:14px; }
.ek-wrap.ek-sm .ek-mini-sub { font-size:9px; }
.ek-wrap.ek-sm .ek-foot { display:none; }

.ek-wrap.ek-xs .ek-compact { padding:33px 7px 4px; }
.ek-wrap.ek-xs .ek-period { top:28px; right:6px; font-size:9px; padding:2px 6px; }
.ek-wrap.ek-xs .ek-mini-grid { gap:3px; padding-top:5px; }
.ek-wrap.ek-xs .ek-mini-row { grid-template-columns:13px minmax(0,1fr) minmax(70px,auto); gap:3px; }
.ek-wrap.ek-xs .ek-dot { width:8px; height:8px; }
.ek-wrap.ek-xs .ek-mini-label { font-size:10px; }
.ek-wrap.ek-xs .ek-mini-main { font-size:12px; }
.ek-wrap.ek-xs .ek-mini-sub { font-size:8px; margin-top:1px; }
.ek-wrap.ek-xs .ek-foot { display:none; }
</style>

<div class="ek-wrap" id="ekWrap">
    <section class="ek-compact">
        <div class="ek-period" id="compactPeriod">Heute</div>
        <div class="ek-mini-grid">
            <div class="ek-mini-row">
                <span class="ek-dot grid"></span>
                <span class="ek-mini-label">Netzbezug</span>
                <span class="ek-value-box"><div class="ek-mini-main" id="cGridEuro">—</div><div class="ek-mini-sub" id="cGrid">—</div></span>
            </div>
            <div class="ek-mini-row">
                <span class="ek-dot feed"></span>
                <span class="ek-mini-label">Einspeisung</span>
                <span class="ek-value-box"><div class="ek-mini-main" id="cFeedEuro">—</div><div class="ek-mini-sub" id="cFeed">—</div></span>
            </div>
            <div class="ek-mini-row">
                <span class="ek-dot heat"></span>
                <span class="ek-mini-label">Heizstab</span>
                <span class="ek-value-box"><div class="ek-mini-main" id="cHeat">—</div><div class="ek-mini-sub" id="cOil">—</div></span>
            </div>
        </div>
        <div class="ek-foot">Antippen für Diagramm &amp; Prognose</div>
        <button class="ek-open" id="openDetails" aria-label="Energie-Diagramm und Prognose öffnen"></button>
    </section>
</div>

<script>
const EK_DETAIL_ID = __DETAIL_ID__;
let ekData = __INITIAL_DATA__;
let compactIndex = 0;
let compactTimer = null;

const validNumber = n => n !== null && n !== '' && Number.isFinite(Number(n));
const euro = n => validNumber(n) ? Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €' : '—';
const kwh = n => validNumber(n) ? Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' kWh' : '—';
const liter = n => validNumber(n) ? Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' L Öl gespart' : '—';

function periodConfig() {
    return [
        {key:'today', label:'Heute'},
        {key:'month', label:'Monat'},
        {key:'year', label:'Jahr'}
    ];
}

function renderCompact() {
    if (!ekData || !ekData.ok || !ekData.summary) return;
    const periods = periodConfig();
    const p = periods[compactIndex % periods.length];
    const s = ekData.summary[p.key];
    if (!s) return;

    document.getElementById('compactPeriod').textContent = p.label;

    // Netzbezug/Einspeisung: Euro bewusst groß und fett, kWh kleiner darunter.
    document.getElementById('cGridEuro').textContent = euro(s.grid.euro);
    document.getElementById('cGrid').textContent = kwh(s.grid.kwh);
    document.getElementById('cFeedEuro').textContent = euro(s.feed.euro);
    document.getElementById('cFeed').textContent = kwh(s.feed.kwh);

    // Heizstab nach Auswahl 1A: kWh groß, Liter Öl kleiner darunter.
    document.getElementById('cHeat').textContent = kwh(s.heater.kwh);
    document.getElementById('cOil').textContent = liter(s.heater.oilLiter);
}

function restartCompactTimer() {
    if (compactTimer) clearInterval(compactTimer);
    const sec = Math.max(3, Math.min(60, Number(ekData?.cycleSeconds || 8)));
    compactTimer = setInterval(() => {
        compactIndex = (compactIndex + 1) % periodConfig().length;
        renderCompact();
    }, sec * 1000);
}

function adaptToTileSize() {
    const wrap = document.getElementById('ekWrap');
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    wrap.classList.remove('ek-sm','ek-xs');
    if (w < 205 || h < 145) wrap.classList.add('ek-xs');
    else if (w < 285 || h < 205) wrap.classList.add('ek-sm');
}

function renderAll() {
    renderCompact();
    restartCompactTimer();
    adaptToTileSize();
}

function handleMessage(data) {
    try {
        ekData = (typeof data === 'string') ? JSON.parse(data) : data;
    } catch (e) {
        ekData = {ok:false};
    }
    renderAll();
}
window.handleMessage = handleMessage;

document.getElementById('openDetails').addEventListener('click', () => {
    if (typeof openObject === 'function' && EK_DETAIL_ID > 0) openObject(EK_DETAIL_ID);
});

if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(adaptToTileSize).observe(document.getElementById('ekWrap'));
} else {
    window.addEventListener('resize', adaptToTileSize);
}

renderAll();
</script>
