<style>
:root{
    --ek-bg1:#172235;
    --ek-bg2:#0e1624;
    --ek-text:#f4f7fb;
    --ek-muted:#aeb9c8;
    --ek-border:rgba(255,255,255,.10);
    --ek-grid:#ef5b5b;
    --ek-feed:#35b56f;
    --ek-heat:#f09a35;
    --ek-chip:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:0}
.ek-wrap{
    --s:1;
    position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;
    color:var(--ek-text);
    background:linear-gradient(145deg,var(--ek-bg1),var(--ek-bg2));
    border:1px solid var(--ek-border);border-radius:calc(16px * var(--s));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 4px 16px rgba(0,0,0,.18);
}
.ek-inner{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:calc(7px * var(--s));padding:calc(13px * var(--s)) calc(14px * var(--s)) calc(10px * var(--s))}
.ek-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.ek-title{font-size:calc(17px * var(--s));line-height:1;font-weight:750;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-period{flex:0 0 auto;font-size:calc(10px * var(--s));line-height:1;color:var(--ek-muted);padding:calc(4px * var(--s)) calc(8px * var(--s));border:1px solid var(--ek-border);border-radius:999px;background:var(--ek-chip);white-space:nowrap}
.ek-grid{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));align-items:stretch;min-height:0}
.ek-row{display:grid;grid-template-columns:calc(13px * var(--s)) minmax(0,1fr) auto;align-items:center;column-gap:calc(8px * var(--s));min-width:0;border-top:1px solid rgba(255,255,255,.055)}
.ek-row:first-child{border-top:0}
.ek-dot{width:calc(8px * var(--s));height:calc(8px * var(--s));border-radius:50%;justify-self:center;box-shadow:0 0 calc(8px * var(--s)) currentColor}
.ek-dot.grid{background:var(--ek-grid);color:var(--ek-grid)}
.ek-dot.feed{background:var(--ek-feed);color:var(--ek-feed)}
.ek-dot.heat{background:var(--ek-heat);color:var(--ek-heat)}
.ek-label{min-width:0;font-size:calc(11.5px * var(--s));color:var(--ek-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ek-values{text-align:right;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.ek-main{font-size:calc(17px * var(--s));line-height:1.05;font-weight:850;letter-spacing:.1px}
.ek-sub{margin-top:calc(3px * var(--s));font-size:calc(9px * var(--s));line-height:1;color:var(--ek-muted);font-weight:500}
.ek-foot{font-size:calc(8.5px * var(--s));line-height:1;color:var(--ek-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.ek-open{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer;z-index:10}
.ek-wrap.compact .ek-inner{padding-bottom:calc(7px * var(--s));gap:calc(4px * var(--s))}
.ek-wrap.compact .ek-foot{display:none}
.ek-wrap.tight .ek-title{font-size:calc(15px * var(--s))}
.ek-wrap.tight .ek-label{font-size:calc(10.5px * var(--s))}
.ek-wrap.tight .ek-main{font-size:calc(15.5px * var(--s))}
.ek-wrap.tight .ek-sub{font-size:calc(8.3px * var(--s))}
.ek-wrap.tiny .ek-label{display:none}
.ek-wrap.tiny .ek-row{grid-template-columns:calc(11px * var(--s)) minmax(0,1fr)}
.ek-wrap.tiny .ek-values{grid-column:2;width:100%}
</style>

<div class="ek-wrap" id="ekWrap">
    <div class="ek-inner">
        <div class="ek-head">
            <div class="ek-title">Energie</div>
            <div class="ek-period" id="compactPeriod">Heute</div>
        </div>
        <div class="ek-grid">
            <div class="ek-row">
                <span class="ek-dot grid"></span><span class="ek-label">Netzbezug</span>
                <span class="ek-values"><div class="ek-main" id="cGridEuro">—</div><div class="ek-sub" id="cGrid">—</div></span>
            </div>
            <div class="ek-row">
                <span class="ek-dot feed"></span><span class="ek-label">Einspeisung</span>
                <span class="ek-values"><div class="ek-main" id="cFeedEuro">—</div><div class="ek-sub" id="cFeed">—</div></span>
            </div>
            <div class="ek-row">
                <span class="ek-dot heat"></span><span class="ek-label">Heizstab</span>
                <span class="ek-values"><div class="ek-main" id="cHeat">—</div><div class="ek-sub" id="cOil">—</div></span>
            </div>
        </div>
        <div class="ek-foot">Antippen für Diagramm &amp; Prognose</div>
    </div>
    <button class="ek-open" id="openDetails" aria-label="Energie-Diagramm und Prognose öffnen"></button>
</div>

<script>
const EK_DETAIL_ID=__DETAIL_ID__;
let ekData=__INITIAL_DATA__,compactIndex=0,compactTimer=null;
const validNumber=n=>n!==null&&n!==''&&Number.isFinite(Number(n));
const euro=n=>validNumber(n)?Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':'—';
const kwh=n=>validNumber(n)?Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' kWh':'—';
const liter=n=>validNumber(n)?Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' L Öl gespart':'—';
const periods=()=>[{key:'today',label:'Heute'},{key:'month',label:'Monat'},{key:'year',label:'Jahr'}];
function renderCompact(){
    if(!ekData?.ok||!ekData.summary)return;
    const p=periods()[compactIndex%3],s=ekData.summary[p.key];if(!s)return;
    compactPeriod.textContent=p.label;
    cGridEuro.textContent=euro(s.grid.euro);cGrid.textContent=kwh(s.grid.kwh);
    cFeedEuro.textContent=euro(s.feed.euro);cFeed.textContent=kwh(s.feed.kwh);
    cHeat.textContent=kwh(s.heater.kwh);cOil.textContent=liter(s.heater.oilLiter);
}
function restartTimer(){
    if(compactTimer)clearInterval(compactTimer);
    const sec=Math.max(3,Math.min(60,Number(ekData?.cycleSeconds||8)));
    compactTimer=setInterval(()=>{compactIndex=(compactIndex+1)%3;renderCompact()},sec*1000);
}
function adapt(){
    const w=ekWrap.clientWidth,h=ekWrap.clientHeight;
    const s=Math.max(.68,Math.min(1.18,Math.min(w/290,h/245)));
    ekWrap.style.setProperty('--s',s.toFixed(3));
    ekWrap.classList.toggle('compact',h<225||w<250);
    ekWrap.classList.toggle('tight',h<190||w<210);
    ekWrap.classList.toggle('tiny',w<165);
}
function renderAll(){renderCompact();restartTimer();adapt()}
function handleMessage(data){try{ekData=typeof data==='string'?JSON.parse(data):data}catch(e){ekData={ok:false}}renderAll()}
window.handleMessage=handleMessage;
openDetails.addEventListener('click',()=>{if(typeof openObject==='function'&&EK_DETAIL_ID>0)openObject(EK_DETAIL_ID)});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(adapt).observe(ekWrap);else window.addEventListener('resize',adapt);
renderAll();
</script>
